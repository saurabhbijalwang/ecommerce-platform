spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_auth_db}
    username: ${AUTH_DB_USERNAME:auth_user}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      connection-timeout: 30000
      data-source-properties:
        ApplicationName: auth-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8084}
    audience: ${AUTH_JWT_AUDIENCE:ecommerce-platform}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64}
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64}

server:
  port: ${AUTH_SERVER_PORT:8084}
  address: ${AUTH_SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
