spring:
  application:
    name: cms-service
  datasource:
    url: ${CMS_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_cms_db}
    username: ${CMS_DB_USERNAME:cms_writer}
    password: ${CMS_WRITER_PASSWORD}
    hikari:
      maximum-pool-size: ${CMS_DB_POOL_SIZE:10}
      connection-timeout: 30000
      data-source-properties:
        ApplicationName: cms-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8084}
    audience: ${AUTH_JWT_AUDIENCE:ecommerce-platform}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8084/.well-known/jwks.json}

server:
  port: ${CMS_SERVER_PORT:8083}
  address: ${CMS_SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
