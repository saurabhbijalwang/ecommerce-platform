spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: product-search-service
              uri: lb://search-service
              predicates:
                - Path=/api/v1/products/**
            - id: cms-service
              uri: lb://cms-service
              predicates:
                - Path=/api/v1/admin/catalog/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8084}
    audience: ${AUTH_JWT_AUDIENCE:ecommerce-platform}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8084/.well-known/jwks.json}
